name = "sonora-website"
account_id = "a8cac7de18dba8864b6c0a0aacfbeb6d"
compatibility_date = "2026-09-08"
main = "worker/index.ts"

[assets]
directory = "./build"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "DOWNLOADS"
class_name = "Downloads"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Downloads"]

[[durable_objects.bindings]]
name = "SUBMISSIONS"
class_name = "Submissions"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Submissions"]
